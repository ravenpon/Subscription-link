name: Update Subscription

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:  # اجازه میده دستی هم از تب Actions اجراش کنی

# جلوگیری از اجرای هم‌زمان دو تا instance روی هم
# (مهمه چون Telegram Session نباید هم‌زمان از دو جا استفاده بشه)
concurrency:
  group: ravvpn2-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ geoip_cache.json
          git diff --staged --quiet || git commit -m "🔄 آپدیت خودکار کانفیگ‌ها"
          git pull --rebase
          git push